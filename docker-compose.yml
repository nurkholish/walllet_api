services:
  db:
    image: postgres:16-alpine
    container_name: wallet_db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-wallet_api_development}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: wallet_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-wallet_api_development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change_me}
      LSP_PROVIDER: ${LSP_PROVIDER:-yahoo}
      LSP_STUB_MODE: ${LSP_STUB_MODE:-false}
      LSP_TIMEOUT: ${LSP_TIMEOUT:-10}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-latest-stock-price.p.rapidapi.com}
      RAPIDAPI_BASE_URL: ${RAPIDAPI_BASE_URL:-https://latest-stock-price.p.rapidapi.com}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password123}
      RAILS_LOG_TO_STDOUT: "true"
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./lib:/app/lib
    command: ["./bin/docker-entrypoint", "bundle", "exec", "puma", "-C", "config/puma.rb"]
    stdin_open: true
    tty: true

volumes:
  pgdata: